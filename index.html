<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江氏小六壬排盘器</title>
    <meta name="description" content="江氏小六壬排盘器：日时起卦、数字起卦、术语解释、AI 解卦与本地笔记。">
    <link rel="alternate" hreflang="zh-CN" href="https://xiaoliuren.cc/">
    <link rel="alternate" hreflang="en" href="https://xiaoliuren.cc/?lang=en">
    <link rel="alternate" hreflang="x-default" href="https://xiaoliuren.cc/">
    <!-- 第三方依赖 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh.js"></script>
    <!-- 应用样式 -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2170699185917072"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="page-root">

    <!-- 页头 -->
    <div class="page-header">
        <button type="button" id="openDevLogButton" class="dev-log-open-button small-action-button" data-i18n="header.devLog">开发日志</button>
        <div class="page-header-main">
            <h1 class="page-title" data-i18n="app.title">江氏小六壬排盘器</h1>
            <div class="lang-switch" role="group" data-i18n-aria="header.lang">
                <button type="button" class="lang-switch-button" data-lang="zh">中文</button>
                <button type="button" class="lang-switch-button" data-lang="en">EN</button>
            </div>
        </div>
        <button type="button" id="openNotesLibraryButton" class="notes-library-open-button small-action-button" data-i18n="header.notes">我的笔记</button>
    </div>

    <!-- 主内容区：时钟 / 起卦设置 / 排盘盘面 -->
    <div class="left-column-panels">
        <div id="timePanel" class="theme-panel time-panel">
            <div id="solarClock">0000年0月0日 00:00:00</div>
            <div id="lunarClock" data-i18n="clock.lunarLoading">获取农历中...</div>
        </div>

        <div id="settingPanel" class="theme-panel setting-panel">
            <div id="method-section" class="notes-row">
                <span class="notes-field-label" data-i18n="settings.method">起卦方法</span>
                <div class="global-dropdown dropdown-method">
                    <input type="hidden" id="method" value="日时起卦">
                </div>
            </div>
            <div id="query-item-section" class="notes-row">
                <span class="notes-field-label" data-i18n="settings.queryItem">求测事项</span>
                <div class="global-dropdown dropdown-query-item">
                    <input type="hidden" id="queryItem" value="吉凶">
                </div>
            </div>
            <div id="datetime-section" class="datetime-section">
                    <label class="notes-field-label" data-i18n="settings.datetime">选择时间</label>
                <div class="datetime-controls">
                    <div id="dateTimePickerWrap" class="datetime-picker-wrap">
                        <input
                            type="text"
                            id="dateTimeManualInput"
                            placeholder="yyyy/mm/dd HH:mm"
                            inputmode="numeric"
                            maxlength="16"
                            pattern="\d{4}/\d{2}/\d{2} \d{2}:\d{2}"
                            class="datetime-manual-input"
                        >
                        <button type="button" id="dateTimePickerButton" class="datetime-picker-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </button>
                        <input type="hidden" id="dateTime">
                        <input type="text" id="dateTimeCalendarInput" class="hidden" tabindex="-1" aria-hidden="true">
                    </div>
                    <button type="button" id="dateTimeNowButton" class="datetime-now-button small-action-button" data-i18n="settings.now">当前时间</button>
                </div>
                <div id="selectedDateLunarInfo" class="selected-date-lunar-info"></div>
            </div>
            <div id="num-section" class="num-section is-hidden">
                <label class="notes-field-label" for="numInput" data-i18n="settings.number">选择数字</label>
                <div class="num-controls">
                    <div class="datetime-picker-wrap">
                        <input
                            type="number"
                            id="numInput"
                            class="datetime-manual-input num-input"
                            placeholder="请输入任意数字"
                            data-i18n-placeholder="settings.numberPlaceholder"
                            min="1"
                            step="1"
                            inputmode="numeric"
                        >
                        <span class="num-picker-trailing" aria-hidden="true"></span>
                    </div>
                    <button type="button" id="numRandomButton" class="small-action-button num-button" data-i18n="settings.randomNumber">随机数字</button>
                </div>
            </div>
            <div id="specific-question-section" class="notes-row">
                <span class="notes-field-label" data-i18n="settings.question">具体问题</span>
                <textarea id="specificQuestion" class="specific-question notes-field-input" placeholder="(选填)" data-i18n-placeholder="settings.questionPlaceholder"></textarea>
            </div>
        </div>

        <div id="mainPanel" class="theme-panel main-panel">
            <button onclick="startCalculation()" class="action-button action-theme-button" data-i18n="action.cast">开始排盘</button>
            <div id="palaceGrid" class="hex-grid"></div>
        </div>
    </div>

    <!-- 断卦笔记面板 -->
    <div id="notesPanelContainer" class="theme-panel notes-panel">
        <div class="notes-panel-header">
            <div class="notes-panel-title" data-i18n="notes.title">断卦笔记</div>
        </div>
        <div class="notes-ai-row">
            <button type="button" id="changePrompt" class="small-action-button change-prompt-button" data-i18n="notes.editPrompt">修改AI提示词</button>
            <button type="button" id="specifyPalaceButton" class="small-action-button specify-palace-button" data-i18n="notes.specifyPalace">指定解读宫位</button>
            <button type="button" id="askAiButton" class="notes-ai-button action-theme-button" data-i18n="notes.askAi">问AI</button>
        </div>
        <div id="notesEntriesContainer" class="notes-entries" style="margin-bottom: 2rem;"></div>
        <div class="notes-add-row">
            <button type="button" id="addNoteRowButton" class="notes-add-circle-button"><span class="notes-add-circle-button-label">+</span></button>
            <button type="button" id="removeNoteRowButton" class="notes-add-circle-button" aria-pressed="false"><span class="notes-add-circle-button-label">-</span></button>
            <button type="button" id="saveNotesButton" class="notes-save-button small-action-button" data-i18n="notes.save">保存笔记</button>
            <button type="button" id="resetBoardButton" class="small-action-button notes-save-button" data-i18n="notes.reset">重置盘面</button>
        </div>
    </div>

    <!-- HTML 模板 -->
    <template id="notesLibraryItemTemplate">
        <div class="notes-library-item">
            <div>
                <div class="notes-library-item-time"></div>
                <div class="notes-library-item-desc"></div>
            </div>
            <button type="button" class="notes-library-delete-button action-theme-button" data-i18n="notes.delete">删除</button>
        </div>
    </template>

    <!-- 浮层：笔记库 -->
    <div id="notesLibraryPanel" class="theme-panel notes-library-panel is-hidden">
        <div class="notes-library-header">
            <span class="notes-library-title" data-i18n="library.title">我的笔记</span>
            <button type="button" id="clearNotesLibraryButton" class="small-action-button notes-library-clear-button" data-i18n="library.clear">清空所有笔记</button>
            <div class="notes-library-header-actions">
                <button type="button" id="closeNotesLibraryButton" class="small-action-button notes-library-close-button" data-i18n="library.close">关闭</button>
            </div>
        </div>
        <div id="notesLibraryList" class="notes-library-list"></div>
        <div id="notesLibraryEmpty" class="notes-library-empty" data-i18n="library.empty">暂无笔记</div>
    </div>
    <div id="notesLibraryBackdrop" class="notes-library-backdrop is-hidden"></div>

    <!-- 浮层：指定解读宫位 -->
    <div id="palaceSpecifyBackdrop" class="palace-specify-backdrop is-hidden" aria-hidden="true">
        <div id="palaceSpecifyHint" class="palace-specify-hint" aria-live="polite" data-i18n="specify.hint">请手动指定AI解读宫位（默认为AI自动选择）</div>
        <div class="palace-specify-shade palace-specify-shade-top"></div>
        <div class="palace-specify-shade palace-specify-shade-left"></div>
        <div class="palace-specify-shade palace-specify-shade-right"></div>
        <div class="palace-specify-shade palace-specify-shade-bottom"></div>
    </div>

    <!-- 浮层：AI 提示词编辑 -->
    <div id="promptEditorBackdrop" class="prompt-editor-backdrop is-hidden"></div>
    <div id="promptEditorPanel" class="theme-panel prompt-editor-panel is-hidden" role="dialog" aria-modal="true" data-i18n-aria="prompt.aria">
        <div class="prompt-editor-title" data-i18n="prompt.title">AI提示词</div>
        <textarea
            id="promptTaskLinesInput"
            class="notes-field-input prompt-editor-textarea"
            placeholder="1. ...&#10;2. ...&#10;3. ..."
        ></textarea>
        <div class="prompt-editor-actions">
            <button type="button" id="resetPromptTaskLinesButton" class="small-action-button" data-i18n="prompt.reset">恢复默认</button>
            <button type="button" id="cancelPromptEditButton" class="small-action-button" data-i18n="prompt.cancel">取消</button>
            <button type="button" id="savePromptTaskLinesButton" class="action-theme-button prompt-editor-save-button" data-i18n="prompt.save">保存</button>
        </div>
    </div>

    <!-- 浮层：术语解释 -->
    <div id="referenceHelpBackdrop" class="reference-help-backdrop is-hidden"></div>
    <div id="referenceHelpPanel" class="theme-panel reference-help-panel is-hidden" role="dialog" aria-modal="true" data-i18n-aria="help.aria">
        <div class="reference-help-header">
            <div id="referenceHelpTitle" class="reference-help-title" data-i18n="help.title">术语解释</div>
        </div>
        <div id="referenceHelpContent" class="reference-help-content"></div>
    </div>

    <!-- 浮层：开发日志 -->
    <div id="devLogBackdrop" class="reference-help-backdrop dev-log-backdrop is-hidden"></div>
    <div id="devLogPanel" class="theme-panel reference-help-panel dev-log-panel is-hidden" role="dialog" aria-modal="true" data-i18n-aria="devLog.aria">
        <div class="reference-help-header">
            <div class="reference-help-title" data-i18n="devLog.title">开发日志</div>
        </div>
        <div id="devLogContent" class="reference-help-content dev-log-content"></div>
    </div>

    </div>

    <!-- 应用脚本 -->
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/app.js"></script>
    <!-- Vercel Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
