<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江氏小六壬排盘器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page-root">

    <div class="page-header">
        <h1 class="page-title">
            江氏小六壬排盘器
        </h1>
        <button type="button" id="openNotesLibraryButton" class="notes-library-open-button small-action-button">
            我的笔记
        </button>
    </div>

    <div id="notesLibraryPanel" class="theme-panel notes-library-panel is-hidden">
        <div class="notes-library-header">
            <span class="notes-library-title">我的笔记</span>
            <button type="button" id="clearNotesLibraryButton" class="small-action-button notes-library-clear-button">清空所有笔记</button>
            <div class="notes-library-header-actions">
                <button type="button" id="closeNotesLibraryButton" class="small-action-button notes-library-close-button">关闭</button>
            </div>
        </div>
        <div id="notesLibraryList" class="notes-library-list"></div>
        <div id="notesLibraryEmpty" class="notes-library-empty">暂无笔记</div>
    </div>
    <template id="notesLibraryItemTemplate">
        <div class="notes-library-item">
            <div>
                <div class="notes-library-item-time"></div>
                <div class="notes-library-item-desc"></div>
            </div>
            <button type="button" class="notes-library-delete-button action-theme-button">删除</button>
        </div>
    </template>

    <div class="left-column-panels">
        <div id="timePanel" class="theme-panel time-panel">
            <div id="solarClock">
                0000年0月0日 00:00:00
            </div>
            <div id="lunarClock">
                获取农历中...
            </div>
        </div>
        <div id="settingPanel" class="theme-panel setting-panel">
            <div id="method-section" class="notes-row">
                <label for="methodTrigger" class="notes-field-label">起卦方法</label>
                <div class="global-dropdown dropdown-method">
                    <input type="hidden" id="method" value="日时起卦">
                </div>
            </div>
            <div id="query-item-section" class="notes-row">
                <label for="queryItemTrigger" class="notes-field-label">求测事项</label>
                <div class="global-dropdown dropdown-query-item">
                    <input type="hidden" id="queryItem" value="吉凶">
                </div>
            </div>
            <div id="specific-question-section" class="notes-row">
                <label for="specificQuestion" class="notes-field-label">具体问题</label>
                <textarea id="specificQuestion" class="specific-question notes-field-input" placeholder="(选填)"></textarea>
            </div>
            <div id="datetime-section" class="datetime-section">
                <label class="notes-field-label">选择时间</label>
                <div class="datetime-controls">
                    <div id="dateTimePickerWrap" class="datetime-picker-wrap">
                        <input
                            type="text"
                            id="dateTimeManualInput"
                            placeholder="yyyy/mm/dd HH:mm"
                            inputmode="numeric"
                            maxlength="16"
                            pattern="\d{4}/\d{2}/\d{2} \d{2}:\d{2}"
                            class="datetime-manual-input"
                        >
                        <button
                            type="button"
                            id="dateTimePickerButton"
                            class="datetime-picker-button"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </button>
                        <input type="hidden" id="dateTime">
                        <input type="text" id="dateTimeCalendarInput" class="hidden" tabindex="-1" aria-hidden="true">
                    </div>
                    <button
                        type="button"
                        id="dateTimeNowButton"
                        class="datetime-now-button small-action-button"
                    >
                        当前时间
                    </button>
                </div>
                <div id="selectedDateLunarInfo" class="selected-date-lunar-info"></div>
            </div>
            <div id="num-section" class="num-section is-hidden">
                <label class="notes-field-label" for="numInput">选择数字</label>
                <div class="num-controls">
                    <div class="datetime-picker-wrap">
                        <input
                            type="number"
                            id="numInput"
                            class="datetime-manual-input num-input"
                            placeholder="请输入任意数字"
                            min="1"
                            step="1"
                            inputmode="numeric"
                        >
                        <span class="num-picker-trailing" aria-hidden="true"></span>
                    </div>
                    <button type="button" id="numRandomButton" class="small-action-button num-button">随机数字</button>
                </div>
            </div>
        </div>

        <div id="mainPanel" class="theme-panel main-panel">
         
            <button onclick="startCalculation()" class="action-button action-theme-button">
                开始排盘
            </button>
            <div id="palaceGrid" class="hex-grid">
            </div>
        </div>
    </div>

    <div id="notesPanelContainer" class="theme-panel notes-panel">
        <div class="notes-panel-title">断卦笔记</div>
        <div class="notes-ai-row">
            <button type="button" id="askAiButton" class="notes-ai-button action-theme-button">问AI</button>
            <button type="button" id="changePrompt" class="small-action-button change-prompt-button">修改AI提示词</button>
        </div>
        <div id="notesEntriesContainer" class="notes-entries" style="margin-bottom: 2rem;"></div>
        <div class="notes-add-row">
            <button type="button" id="addNoteRowButton" class="notes-add-circle-button"><span class="notes-add-circle-button-label">+</span></button>
            <button type="button" id="removeNoteRowButton" class="notes-add-circle-button" aria-pressed="false"><span class="notes-add-circle-button-label">-</span></button>
            <button type="button" id="saveNotesButton" class="notes-save-button small-action-button">保存笔记</button>
            <button type="button" id="resetBoardButton" class="small-action-button notes-save-button">重置盘面</button>
        </div>
    </div>
    <div id="promptEditorBackdrop" class="prompt-editor-backdrop is-hidden"></div>
    <div id="promptEditorPanel" class="theme-panel prompt-editor-panel is-hidden" role="dialog" aria-modal="true" aria-label="修改AI提示词">
        <div class="prompt-editor-title">AI提示词</div>
        <textarea
            id="promptTaskLinesInput"
            class="notes-field-input prompt-editor-textarea"
            placeholder="1. ...&#10;2. ...&#10;3. ..."
        ></textarea>
        <div class="prompt-editor-actions">
            <button type="button" id="resetPromptTaskLinesButton" class="small-action-button">恢复默认</button>
            <button type="button" id="cancelPromptEditButton" class="small-action-button">取消</button>
            <button type="button" id="savePromptTaskLinesButton" class="action-theme-button prompt-editor-save-button">保存</button>
        </div>
    </div>
    </div>
    <script src="js/main.js"></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
