<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>江氏小六壬排盘器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh.js"></script>
    <style>
        @font-face {
            font-family: 'STZHONGS';
            src: url('./STZHONGS.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        :root {
            /* ===== 颜色 ===== */
            --brown: #5a381f;
            --dark-brown: #4b3521;
            --light: #fff8ea;
            --dark: #f5e8cf;
            --gold: #b59443;
            --panel-top-margin: 0rem;

            /* ===== 面板容器 ===== */
            --panel-border-radius: 10px;                      /* 面板圆角 */
            --panel-gap: 0.9rem;                              /* 面板间距 */

            /* ===== 字号 ===== */
            --page-title-font-size: 2.5rem;                  /* 标题字号 */
            
            /* ===== 时间面板 ===== */
            --solar-clock-font-size: 2rem;                   /* 当地时间字号 */
            --solar-clock-letter-spacing: 0.05em;              /* 当地时间字间距 */
            --lunar-clock-font-size: 1.7rem;                  /* 农历时间字号 */
            --lunar-clock-letter-spacing: 0.15em;               /* 农历时间字间距 */

            /* ===== 下拉项 ===== */
            --custom-select-option-line-height: 2.5rem;          /* 自定义下拉项行距（通用） */
            --custom-select-option-radius: 0.4rem;            /* 拉项圆角 */
            --custom-select-slider-height: 15rem;             /* 下拉列表高度（通用） */
 
            /* ===== 起卦时间栏 ===== */
            --datetime-picker-text-size: 1.6rem;               /* 起卦时间栏文字字号 */
            --datetime-picker-calendar-btn-size: 1.6rem;       /* 起卦时间栏日历按钮大小 */
            --datetime-picker-border-width: 1.5px;             /* 起卦时间栏边框粗细 */
            --datetime-title-text-size: 2rem;                  /* “起卦时间”文字字号 */
            --datetime-lunar-info-text-size: 1.6rem;           /* 起卦时间下方农历文字字号 */
          
            /* ===== 五星/六神/六亲 ===== */
            --palace-badge-font-size: 2rem;                    /* 字号 */
            --palace-badge-side-gap: 0.7rem;                   /* 左右距边缘 */
            --palace-badge-top-gap: 0.7rem;                    /* 顶部距边缘 */
            --palace-zhi-font-size: 2.5rem;                    /* 地支字号 */
            --palace-name-font-size: 2.5rem;                    /* 宫位名字号 */
            --palace-marker-font-size: 1.7rem;                 /* “身/时/日”标志字号 */

            /* ===== 日历容器 ===== */
            --calendar-weekday-text-size: 1rem;                /* 星期字号 */
            --calendar-date-text-size: 1.3rem;                 /* 日期字号 */
            --calendar-date-cell-height: 3rem;                 /* 单元格高度 */
            --calendar-grid-inline-padding: 1.4rem;            /* 网格左右内边距 */
            --calendar-base-text-size: 1.3rem;                 /* 日历通用字号 */
            --calendar-header-title-size: 1.3rem;              /* 年/月标题字号 */
            --calendar-header-title-gap: 1rem;                 /* 年/月标题间距 */
            --calendar-header-title-offset-x: 0.9rem;          /* 年/月标题横向偏移 */
            --calendar-nav-arrow-size: 2rem;                   /* 左右切换箭头字号 */
            
            /* ===== 笔记面板 ===== */
            --notes-font-size: 1.8rem;                         /* 笔记面板字段字号 */
            --notes-ai-button-font-size: 2rem;               /* “问AI”按钮字号 */
            --notes-select-border-radius: 0.4rem;                /* 笔记输入框圆角（含下拉框） */
            --notes-select-border-width: 2px;                  /* 笔记输入框边框粗细（含下拉框） */
            --notes-select-border-color: #4b3521;               /* 笔记输入框边框颜色（含下拉框） */
            --notes-select-bg-color: #ffffff;                /* 笔记输入框背景色（含下拉框） */
            --notes-handler-bg-color: #f5e8cf;                 /* 笔记条目 handler 按钮背景色 */
            --notes-drag-placeholder-bg-color: rgba(75, 53, 33, 0.05); /* 拖动时预览占位背景色 */
            --notes-add-btn-bg-color: #f5e8cf;                 /* 笔记 + / - 按钮默认背景色 */
            --notes-add-btn-main-color: #5a381fba;             /* 笔记 + / - 按钮默认边框/文字色 */
            --notes-add-btn-hover-bg-color: #e0c9a795;           /* 笔记 + / - 按钮悬停背景色 */
            --notes-add-btn-hover-border-color: #5a381f;       /* 笔记 + / - 按钮悬停边框色 */
            --notes-add-btn-strong-color: #4b3521;             /* 笔记 + / - 按钮悬停文字/按下边框文字色 */
            --notes-add-btn-active-bg-color: #e0c9a795;          /* 笔记 + / - 按钮按下/激活背景色 */
            
            /* ===== 宫位图 ===== */
            --notes-palace-unselected-fill-color: rgba(255, 255, 255, 0); /* 宫位图未选择填充色 */
            --notes-palace-selected-fill-color: transparent; /* 宫位图已选择填充色 */
            --notes-palace-dash-thickness: 2px; /* 宫位图虚线粗细 */
            --notes-palace-dash-gap: 0.5rem; /* 宫位图虚线稀疏程度（间隔） */
            --notes-palace-dash-outset: 0.25rem; /* 宫位图虚线外扩程度 */

        
        }
        html {
            font-size: 15px;
        }
        @media (min-aspect-ratio: 1001/1000) {
            html {
                font-size: calc(17 * 100vw / 1600);
            }
        }
        @media (max-aspect-ratio: 1/1) {
            html {
                font-size: calc(17 * 100vw / 800);
            }
        }

        body {
            background: var(--dark);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            font-size: 1rem;
            padding-inline: 0.75rem;
        }
        body, body * {
            color: var(--dark-brown) !important;
            font-family: 'STZHONGS', serif !important;
        }
        /* 控制通用面板容器（背景/边框/圆角） */
        .theme-panel {
            background: var(--light);
            border-radius: var(--panel-border-radius);
        }

        /* ===== 通用操作按钮 ===== */
        /* 通用动画 */
        button {
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        button:active {
            transform: scale(0.94);
        }
        button:disabled:active {
            transform: scale(1);
        }
        /* 大按钮 */
        .action-theme-button {
            color: #fffdf7 !important;
            background: #583e2cef;
            border-radius: 1rem;
            font-weight: 700;
        }
        .action-theme-button:hover {
            background: #583e2c;
        }
        /* 小按钮 */
        .small-action-button {
            width: auto;
            height: auto;
            padding: 1rem 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            border-radius: 1rem;
            background: #cb9e2d46;
            color: #4b3521d8!important;
        }
        .small-action-button:hover {
            background: #a3802846;
        }


        /* ===== 页面骨架布局（从上到下） ===== */
        /* 控制页面根容器布局 */
        .page-root {
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            width: 100%;
            padding: 0.3rem;
            max-width: min(100%, 48rem);
            box-sizing: border-box;
            row-gap: var(--panel-gap);
        }
        @media (min-aspect-ratio: 1/1) {
            /* 控制宽屏下页面根容器网格布局 */
            .page-root {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "header header"
                    "time notes"
                    "main notes";
                column-gap: var(--panel-gap);
                row-gap: var(--panel-gap);
                align-items: start;
                max-width: 96rem;
                margin-inline: auto;
            }
            /* 控制宽屏下顶部标题区所在网格区域 */
            .page-header {
                grid-area: header;
            }
            /* 控制宽屏下时间面板所在网格区域 */
            .time-panel {
                grid-area: time;
            }
            /* 控制宽屏下排盘主面板所在网格区域 */
            .main-panel {
                grid-area: main;
            }
            /* 控制宽屏下笔记面板所在网格区域 */
            .notes-panel {
                grid-area: notes;
            }
        }
        


        /* ===== 顶部标题区 ===== */
        /* 分成三列，中间列放标题，右侧列放“我的笔记”按钮*/
        /* 顶部标题区容器：*/
        .page-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            position: relative;
            width: 100%;
            margin-top: 2rem;
            align-items: center;
        }
        /* 控制页面主标题文字样式 */
        .page-title {
            grid-column: 2;
            justify-self: center;
            font-size: var(--page-title-font-size);
            color: var(--brown);
        }
        /* “我的笔记”按钮置于标题区第三列并靠右 */
        .notes-library-open-button {
            grid-column: 3;
            justify-self: end;
            margin-top: 0.3rem;
        }

        /* ===== 笔记库浮层 ===== */
        /* 控制笔记库浮层容器定位与尺寸 */
        .notes-library-panel {
            position: absolute;
            top: var(--notes-library-panel-top, 5.2rem);
            left: 50%;
            transform: translateX(-50%);
            width: min(calc(100% - 1.5rem), 40rem);
            padding: 0.9rem 1rem 1rem;
            border: 2px solid var(--action-btn-bg-color);
            z-index: 1200;
        }
        .notes-library-panel.is-hidden {
            display: none;
        }
        /* 控制笔记库头部行布局 */
        .notes-library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.8rem;
        }
        /* 控制笔记库头部操作按钮组布局 */
        .notes-library-header-actions {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
        }
        /* 控制笔记库标题文本样式 */
        .notes-library-title {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1;
        }
        /* 控制笔记库“关闭”按钮尺寸 */
        .notes-library-close-button {
            height: 2rem;
            padding: 0 0.7rem;
            font-size: 1rem;
            font-weight: 700;
        }
        /* 控制笔记库“清空所有笔记”按钮尺寸 */
        .notes-library-clear-button {
            height: 2rem;
            padding: 0 0.7rem;
            font-size: 1rem;
            font-weight: 700;
        }
        /* 控制笔记库空状态提示样式 */
        .notes-library-empty {
            font-size: 1rem;
            opacity: 0.75;
            text-align: center;
            padding: 0.6rem 0;
        }
        /* 控制笔记库列表容器滚动布局 */
        .notes-library-list {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            max-height: 25rem;
            overflow-y: auto;
            padding-right: 0.2rem;
        }
        /* 控制笔记库单条记录卡片样式 */
        .notes-library-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 0.75rem;
            align-items: center;
            border: 2px solid var(--notes-select-border-color);
            border-radius: var(--notes-select-border-radius);
            background: var(--notes-select-bg-color);
            padding: 0.55rem 0.65rem;
            cursor: pointer;
        }
        .notes-library-item:hover {
            background: #f5e8cf;
        }
        /* 控制笔记库记录时间文本样式 */
        .notes-library-item-time {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.1;
        }
        /* 控制笔记库记录描述文本样式 */
        .notes-library-item-desc {
            font-size: 0.95rem;
            line-height: 1.2;
            margin-top: 0.2rem;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 控制笔记库记录“删除”按钮样式 */
        .notes-library-delete-button {
            height: 2rem;
            padding: 0 0.75rem;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* ===== 时间面板 ===== */
        /* 控制时间面板容器尺寸与内边距 */
        .time-panel {
            margin-top: var(--panel-top-margin);
            width: 100%;
            text-align: center;
            padding: 1rem 0 1.6rem 0;
        }
        #solarClock {
            font-size: var(--solar-clock-font-size);
            letter-spacing: var(--solar-clock-letter-spacing);
        }
        #lunarClock {
            line-height: 1;
            font-size: var(--lunar-clock-font-size);
            letter-spacing: var(--lunar-clock-letter-spacing);
        }

        /* ===== 排盘主面板（起卦时间 + 六宫） ===== */
        /* 控制排盘主面板容器尺寸与内边距 */
        .main-panel {
            padding:1rem 2rem 1rem 2rem;
            width: 100%;
        }

        /* 控制起卦时间区整体纵向布局 */
        .datetime-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 控制“起卦时间”标题文字样式 */
        .datetime-title {
            font-size: var(--datetime-title-text-size);
            color: var(--brown);
        }
        /* 控制起卦时间输入行的网格布局 */
        .datetime-row {
            display: grid;
            width: 100%;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }
        /* 控制时间输入与日历触发器外层容器 */
        .datetime-picker-wrap {
            grid-column: 2;
            display: inline-grid;
            grid-template-columns: auto auto;
            width: auto;

            border: var(--datetime-picker-border-width) solid #4b3521;
            border-radius: 0.625rem;
            background: #fff;
            padding: 0.55rem 0rem 0.55rem 0.9rem;
        }
        /* 控制手动时间输入框尺寸伸缩 */
        .datetime-manual-input {
            font-size: var(--datetime-picker-text-size);
            grid-column: 1;
            width: 16ch;
        }
        .datetime-manual-input:focus,
        .datetime-manual-input:focus-visible {
            outline: none;
            box-shadow: none;
        }
        /* 日历按钮尺寸伸缩 */
        #dateTimePickerButton {
            grid-column: 2;
            justify-self: end;
            align-self: center;
            width: var(--datetime-picker-calendar-btn-size);
            height: auto;
            margin-right: 0.6rem;
        }
        #dateTimePickerButton svg {
            width: 100%;
            height: 100%;
        }
        /* “当前时间”按钮定位 */
        .datetime-now-button {
            grid-column: 3;
            justify-self: start;
            margin-left: 1.2rem;
        }

        /* 起卦时间下方农历信息文本样式 */
        #selectedDateLunarInfo {
            font-size: var(--datetime-lunar-info-text-size);
            font-weight: 700;
            margin-top: 0.7rem;
        }

        /* “开始排盘”主按钮：宽度、字号、字距、内边距等 */
        .action-button {
            margin-top: 1rem;
            text-align: center;
            width: 100%;
            padding: 0.8rem 0 0.8rem 0;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 0.5em;
        }
        /* 六宫容器 */
        .hex-grid {
            padding: 0.2rem;
            margin-top:1.2rem;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            overflow:visible
        }
        /* 单宫 */
        .palace-card {
            outline: 2px solid var(--brown);
            outline-offset: -1px;
            aspect-ratio: 1/1;
        }
        /* 控制宫位内所有标签的绝对定位基类 */
        .palace-slot {
            position: absolute;
            line-height: 1;
            white-space: nowrap;
        }
        /* 五星/六神的纵向位置 */
        .slot-wuxing,
        .slot-liushen {
            top: var(--palace-badge-top-gap);
        }
        /* 五星的横向位置 */
        .slot-wuxing {
            left: var(--palace-badge-side-gap);
        }
        /* 六神的横向位置 */
        .slot-liushen {
            right: var(--palace-badge-side-gap);
        }
        /* 六亲标签位置 */
        .slot-liuqin {
            right: var(--palace-badge-side-gap);
            top: 50%;
            transform: translateY(-50%);
        }
        /* 六亲/六神/五星基础外观 */
        .wuxing-badge,
        .liushen-badge,
        .liuqin-badge {
            font-size: var(--palace-badge-font-size);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.3rem 0.5rem;
            border: 1.5px solid var(--badge-border-color);
            border-radius: 0.6rem;
            background: var(--badge-bg-color);
            color: var(--badge-text-color) !important;
        }
        /* 五星颜色 */
        .wuxing-badge{
            --badge-bg-color: transparent;
        }
        /* 六神颜色 */
        .liushen-badge { 
            --badge-text-color: var(--light); 
        }
        /* 六亲颜色 */
        .liuqin-badge {
            --badge-bg-color: transparent;
            --badge-border-color: #000;
            --badge-text-color: #000;
        }
        /* 地支文本位置与字号 */
        .slot-zhi {
            left: 1rem;
            top: 49%;
            transform: translateY(-50%);
            font-size: var(--palace-zhi-font-size);
            font-weight: 700;
        }
        /* “日/时”标记位置 */
        .slot-daytime {
            left: 0.7rem;
            bottom: 0.7rem;
        }
        /* “身”标记位置 */
        .slot-body {
            left: calc(50% - 1.3rem);
            top: 50%;
            transform: translate(-50%, -50%);
        }
        /* “日/时/身”圆圈字样式 */
        .circled-char {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.5em;
            height: 1.5em;
            border: 1.5px solid #000;
            border-radius: 9999px;
            line-height: 1;
        }
        /* “日/时/身”标记文字排版 */
        .slot-daytime,
        .slot-body {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: var(--palace-marker-font-size);
            font-weight: 700;
        }
        /* 宫位名称文本与下划线动画 */
        .slot-palace-name {
            right: 0.62rem;
            bottom: 0.5rem;
            font-size: var(--palace-name-font-size);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-decoration: none;
            display: inline-block;
            padding-bottom: 0.5rem;
            background-image: linear-gradient(var(--palace-underline-color, var(--dark-brown)), var(--palace-underline-color, var(--dark-brown)));
            background-repeat: no-repeat;
            background-size: 0 2px;
            background-position: -2px calc(100% - 2px);
            transition: background-size 0.25s ease;
        }
        .slot-palace-name.show-underline { background-size: 100% 2px; }

        /* ===== 笔记面板（页面底部） ===== */
        /* 控制笔记面板容器尺寸与内边距 */
        .notes-panel {
            width: 100%;
            max-width: 100%;
            min-height: 8rem;
            margin-bottom: var(--panel-gap);
            padding:
                1.5rem
                1.3rem
                1.3rem;
        }
        /* 控制笔记表单整体纵向布局 */
        .notes-form {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        /* 控制笔记字段行的标签-输入网格布局 */
        .notes-field-row {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 0.75rem;
        }
        /* 控制笔记字段标签文本样式 */
        .notes-field-label {
            font-size: var(--notes-font-size);
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }
        .notes-field-input,
        /* 控制笔记字段输入框/下拉框基础尺寸 */
        .notes-field-select {
            width: 100%;
            height: 3rem;
            font-size: var(--notes-font-size);
            font-weight: 700;
            padding: 0 0.75rem;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        /* 控制笔记输入框边框与背景 */
        .notes-field-input {
            background: var(--notes-select-bg-color);
            border: var(--notes-select-border-width) solid var(--notes-select-border-color);
            border-radius: var(--notes-select-border-radius);
        }
        /* 控制笔记多行输入框文本换行行为 */
        .notes-field-textarea {
            padding: 0.55rem 0.75rem;
            line-height: 1.35;
            resize: none;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        #specificQuestion {
            min-height: 3rem;
            height: auto;
            overflow-y: hidden;
        }
        .notes-field-select option {
            font-size: var(--notes-font-size);
        }
        /* 控制笔记下拉框外层定位（用于箭头） */
        .notes-field-select-wrap {
            position: relative;
        }
        .notes-field-select-wrap.notes-custom-select-ready::after {
            display: none;
        }
        /* 控制“求测事项”下拉框宽度 */
        .notes-query-item-wrap {
            width: 7rem;
            justify-self: start;
        }
        /* 控制笔记下拉框可视边框与右侧留白 */
        .notes-field-select {
            background: var(--notes-select-bg-color);
            border: var(--notes-select-border-width) solid var(--notes-select-border-color);
            border-radius: var(--notes-select-border-radius);
            padding-right: 2.1rem;
            cursor: pointer;
        }
        .notes-field-select-wrap::after {
            content: "";
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-35%);
            width: 0;
            height: 0;
            border-left: 0.6rem solid transparent;
            border-right: 0.6rem solid transparent;
            border-top: 0.8rem solid #000;
            pointer-events: none;
        }
        /* 控制“问AI”按钮外观 */
        .notes-ai-button {
            font-size: var(--notes-ai-button-font-size);
            padding: 0.8rem 0 0.8rem 0;
            letter-spacing: 0.5em;
        }
        /* 控制原生 select 隐藏（交由自定义下拉显示） */
        .notes-native-select {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }
        /* 控制笔记条目列表纵向间距 */
        .notes-entries {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        /* 控制单条笔记行（宫位图/文本/拖拽柄）网格布局 */
        .notes-entry-row {
            display: grid;
            grid-template-columns: minmax(0, var(--notes-palace-size, 6rem)) minmax(0, 1fr) auto;
            gap: 0.6rem;
            align-items: stretch;
            transition: transform 0.16s ease, opacity 0.16s ease;
            touch-action: pan-y;
        }
        .notes-entry-row.is-dragging {
            opacity: 0.9;
            cursor: grabbing;
            pointer-events: none;
            transition: none !important;
            will-change: left, top;
        }
        .notes-entries.is-row-sorting {
            user-select: none;
            -webkit-user-select: none;
        }
        /* 控制拖拽排序时的占位行样式 */
        .notes-entry-placeholder {
            width: 100%;
            border: none;
            border-radius: var(--notes-select-border-radius);
            background: var(--notes-drag-placeholder-bg-color);
            box-sizing: border-box;
        }
        .notes-entry-row.is-no-palace {
            grid-template-columns: minmax(0, 1fr) auto;
        }
        .notes-entry-row.is-no-palace .notes-palace-picker {
            display: none;
        }
        /* 控制笔记行拖拽手柄样式 */
        .notes-entry-handle {
            width: 1.4rem;
            height: 100%;
            border: none;
            border-radius: var(--notes-select-border-radius);
            background: var(--notes-handler-bg-color);
            color: var(--notes-select-border-color);
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1;
            cursor: grab;
            margin-left: -0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .notes-entry-handle:active {
            cursor: grabbing;
        }
        .notes-entry-row .notes-field-input {
            height: var(--notes-palace-size, 6rem);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            overflow-x: hidden;
        }
        .notes-entry-row.is-no-palace .notes-field-input {
            width: 100%;
            transform-origin: right center;
        }
        /* 控制笔记行宫位选择器容器 */
        .notes-palace-picker {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100%;
            aspect-ratio: auto;
        }
        /* 控制笔记行宫位预览触发按钮 */
        .notes-palace-trigger {
            width: 100%;
            height: 100%;
            padding: 0;
            border: var(--notes-select-border-width) solid var(--notes-select-border-color);
            border-radius: var(--notes-select-border-radius);
            border-color: transparent;
            background: var(--notes-palace-unselected-fill-color);
            cursor: pointer;
            position: relative;
            box-shadow: none !important;
            filter: none !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .notes-palace-trigger::before {
            content: "";
            position: absolute;
            inset: calc(-1 * var(--notes-palace-dash-outset));
            border-radius: calc(var(--notes-select-border-radius) + var(--notes-palace-dash-outset));
            pointer-events: none;
            background-image: var(--notes-palace-dash-svg-url, none);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            box-shadow: none !important;
            filter: none !important;
        }
        .notes-palace-trigger.is-selected {
            border-color: var(--notes-select-border-color);
            background: var(--notes-palace-selected-fill-color);
        }
        .notes-palace-trigger.is-selected::before {
            display: none;
        }
        /* 控制宫位未选择时的占位文本 */
        .notes-palace-placeholder {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1;
        }
        /* 控制笔记行中的宫位预览卡片 */
        .notes-palace-preview {
            width: 100%;
            height: 100%;
            position: relative;
            aspect-ratio: auto;
            border: none !important;
            background: transparent !important;
        }
        /* 控制宫位选择下拉弹层布局 */
        .notes-palace-popup {
            position: absolute;
            top: calc(100% + 0.3rem);
            left: 0;
            z-index: 120;
            width: 13rem;
            padding: 0.45rem;
            border: var(--notes-select-border-width) solid var(--notes-select-border-color);
            border-radius: var(--notes-select-border-radius);
            background: var(--notes-select-bg-color);
            box-shadow: 0 0.4rem 1rem rgba(0, 0, 0, 0.12);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.35rem;
        }
        .notes-palace-popup.is-hidden {
            display: none;
        }
        /* 控制宫位选择项按钮样式 */
        .notes-palace-option {
            height: 2.2rem;
            border: 1px solid var(--notes-select-border-color);
            border-radius: 0.45rem;
            background: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .notes-palace-option:hover {
            background: var(--dark);
        }
        /* 控制笔记底部 + / - / 保存 按钮行布局 */
        .notes-add-row {
            display: flex;
            justify-content: center;
            gap: 6rem;
        }
        /* 控制笔记 + / - 圆形按钮外观 */
        .notes-add-circle-button {
            width: 3rem;
            height: 3rem;
            border-radius: 999px;
            border: 0.15rem solid;
            border-color: var(--notes-add-btn-main-color);
            background: var(--notes-add-btn-bg-color);
            font-size: 2.7rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding-bottom: 0.2rem;
            transition: background-color 0.12s ease, border-color 0.12s ease;
        }
        /* 控制笔记 + / - 按钮字符样式 */
        .notes-add-circle-button-label {
            display: inline-block;
            line-height: 1;
            transform: translateY(0);
            color: var(--notes-add-btn-main-color) !important;
            transition: color 0.12s ease;
        }
        #addNoteRowButton .notes-add-circle-button-label {
            transform: translateY(0.12rem);
        }
        #removeNoteRowButton .notes-add-circle-button-label {
            transform: translateY(-0.08rem);
        }
        .notes-add-circle-button:hover {
            background: var(--notes-add-btn-hover-bg-color);
            border-color: var(--notes-add-btn-hover-border-color);
        }
        .notes-add-circle-button:hover .notes-add-circle-button-label {
            color: var(--notes-add-btn-strong-color) !important;
        }
        .notes-add-circle-button:active {
            background: var(--notes-add-btn-active-bg-color);
            border-color: var(--notes-add-btn-strong-color);
        }
        .notes-add-circle-button:active .notes-add-circle-button-label {
            color: var(--notes-add-btn-strong-color) !important;
        }
        .notes-add-circle-button.is-active {
            background: var(--notes-add-btn-active-bg-color);
            border-color: var(--notes-add-btn-strong-color);
        }
        .notes-add-circle-button.is-active .notes-add-circle-button-label {
            color: var(--notes-add-btn-strong-color) !important;
        }
        /* 控制“保存笔记”按钮文本不换行 */
        .notes-save-button {
            white-space: nowrap;
        }
        .notes-entries.is-delete-mode .notes-entry-row {
            cursor: pointer;
            position: relative;
        }
        .notes-entries.is-delete-mode .notes-entry-row > * {
            pointer-events: none;
        }
        .notes-entries.is-delete-mode .notes-entry-row::after {
            content: "";
            position: absolute;
            inset: -0.3rem;
            border-radius: calc(var(--notes-select-border-radius) + 0.18rem);
            background: rgba(0, 0, 0, 0.075);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s ease;
        }
        .notes-entries.is-delete-mode .notes-entry-row:hover::after {
            opacity: 1;
        }

        /* ===== 自定义下拉（笔记与日历头部共用） ===== */
        /* 控制通用自定义下拉根容器 */
        .custom-select {
            position: relative;
            width: var(--custom-select-width, 100%);
        }
        /* 控制通用自定义下拉触发按钮 */
        .custom-select-trigger {
            width: var(--custom-select-trigger-width, 100%);
            min-height: var(--custom-select-trigger-min-height, 0);
            height: var(--custom-select-trigger-height, auto);
            padding: var(--custom-select-trigger-padding, 0 2.1rem 0 0.75rem);
            border: var(--custom-select-trigger-border-width, var(--notes-select-border-width)) solid var(--custom-select-trigger-border-color, var(--notes-select-border-color));
            border-radius: var(--custom-select-trigger-border-radius, var(--notes-select-border-radius));
            background-color: var(--custom-select-trigger-bg-color, var(--notes-select-bg-color));
            background-image:
                linear-gradient(45deg, transparent 50%, #4b3521 50%),
                linear-gradient(135deg, #4b3521 50%, transparent 50%);
            background-position:
                calc(100% - calc(var(--custom-select-arrow-right-gap, 0.75rem) + 0.3rem)) 50%,
                calc(100% - var(--custom-select-arrow-right-gap, 0.75rem)) 50%;
            background-repeat: no-repeat;
            background-size: 0.3rem 0.3rem, 0.3rem 0.3rem;
            color: var(--custom-select-text-color, #4b3521);
            font-size: var(--custom-select-trigger-font-size, var(--notes-font-size));
            font-weight: var(--custom-select-trigger-font-weight, 700);
            line-height: var(--custom-select-trigger-line-height, normal);
            text-align: left;
            outline: none;
            cursor: pointer;
            transform: var(--custom-select-trigger-transform, none);
        }
        .custom-select.is-open .custom-select-trigger {
            background-color: var(--dark);
        }
        /* 控制通用自定义下拉选项列表容器 */
        .custom-select-list {
            position: absolute;
            top: calc(100% + 0.3rem);
            left: 0;
            z-index: 40;
            width: var(--custom-select-list-width, 100%);
            min-width: var(--custom-select-list-min-width, 0);
            max-height: var(--custom-select-list-max-height, var(--custom-select-slider-height));
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: pan-y;
            padding: 0.2rem;
            border: var(--custom-select-list-border-width, var(--notes-select-border-width)) solid var(--custom-select-list-border-color, var(--notes-select-border-color));
            border-radius: var(--custom-select-list-border-radius, var(--notes-select-border-radius));
            background: var(--custom-select-list-bg-color, var(--notes-select-bg-color));
            box-sizing: border-box;
            transform: var(--custom-select-list-transform, none);
        }
        .custom-select-list.is-hidden {
            display: none;
        }
        /* 控制通用自定义下拉选项按钮 */
        .custom-select-option {
            display: block;
            width: 100%;
            padding: 0 0.4rem;
            border: none;
            border-radius: var(--custom-select-option-radius);
            background: transparent;
            text-align: left;
            white-space: nowrap;
            line-height: var(--custom-select-option-line-height);
            font-size: var(--custom-select-option-font-size, var(--notes-font-size));
            font-weight: var(--custom-select-option-font-weight, 700);
            color: var(--custom-select-text-color, #4b3521);
            cursor: pointer;
        }
        .custom-select-option:hover,
        .custom-select-option:focus-visible,
        .custom-select-option.is-selected {
            background: var(--dark);
            outline: none;
        }
        .custom-select-list::-webkit-scrollbar {
            width: 0.4rem;
        }
        .custom-select-list::-webkit-scrollbar-thumb {
            background: #c5ae81;
            border-radius: 999px;
        }
        .notes-panel .custom-select {
            --custom-select-width: 100%;
            --custom-select-trigger-height: 3rem;
            --custom-select-trigger-padding: 0 2.1rem 0 0.75rem;
            --custom-select-trigger-border-width: var(--notes-select-border-width);
            --custom-select-trigger-border-color: var(--notes-select-border-color);
            --custom-select-trigger-border-radius: var(--notes-select-border-radius);
            --custom-select-trigger-bg-color: var(--notes-select-bg-color);
            --custom-select-trigger-font-size: var(--notes-font-size);
            --custom-select-trigger-font-weight: 700;
            --custom-select-list-border-width: var(--notes-select-border-width);
            --custom-select-list-border-color: var(--notes-select-border-color);
            --custom-select-list-border-radius: var(--notes-select-border-radius);
            --custom-select-list-bg-color: var(--notes-select-bg-color);
            --custom-select-list-max-height: var(--custom-select-slider-height);
            --custom-select-option-font-size: var(--notes-font-size);
            --custom-select-option-font-weight: 700;
            --custom-select-text-color: #4b3521;
            --custom-select-arrow-right-gap: 0.75rem;
        }
        /* ===== 日历样式（flatpickr）总览 =====
           目标：
           1) 保持当前布局与视觉不变
           2) 按结构分区，便于后续维护
           3) 删除重复/冲突/非日历规则
        */

        /* ===== A. 外层容器与统一主题 ===== */
        /* 控制日历弹层整体容器外观 */
        .flatpickr-calendar {
            transform-origin: top center !important;
            width: 25rem !important;
            height: auto !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            align-items: center !important;
            background: #fff !important;
            border: 2px solid #4b3521 !important;
            border-radius: 14px !important;
            box-shadow: none !important;
            overflow: hidden !important;
        }

        .flatpickr-months,
        .flatpickr-weekdays,
        .flatpickr-weekdaycontainer,
        .flatpickr-rContainer,
        .flatpickr-days,
        /* 控制日期网格容器背景统一 */
        .dayContainer {
            background: #fff !important;
        }

        .flatpickr-weekday,
        .flatpickr-current-month .flatpickr-monthDropdown-months,
        .flatpickr-current-month input.cur-year,
        .flatpickr-time input,
        .flatpickr-time .flatpickr-time-separator,
        .flatpickr-time .flatpickr-am-pm {
            color: #4b3521 !important;
        }

        /* ===== B. 顶部（月份/年份 + 切换箭头 + 自定义下拉） ===== */
        /* 基础头部：统一字号与垂直对齐 */
        /* 控制日历顶部当前年月区域布局 */
        .flatpickr-current-month {
            display: flex !important;
            align-items: center !important;
            height: 3rem !important;
            padding: 0.5rem !important;
            font-size: var(--calendar-header-title-size) !important;
            font-weight: 700 !important;
        }
        .flatpickr-current-month input.cur-year {
            font-size: var(--calendar-header-title-size) !important;
            font-weight: 700 !important;
        }

        /* 自定义年月下拉模式：居中布局并避免遮挡左右箭头点击 */
        .flatpickr-calendar.with-year-select .flatpickr-current-month {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--calendar-header-title-gap);
            position: relative !important;
            pointer-events: none;
            overflow: visible !important;
            transform: none !important;
            z-index: 6;
            margin-top: 0.3rem !important;
        }

        /* 自定义模式下隐藏 Flatpickr 原生年/月控件 */
        .flatpickr-calendar.with-year-select .flatpickr-current-month input.cur-year,
        .flatpickr-calendar.with-year-select .flatpickr-current-month .flatpickr-monthDropdown-months {
            display: none !important;
        }

        /* 控制日历月份条容器高度与溢出 */
        .flatpickr-month {
            height: auto !important;
            overflow: visible !important;
        }

        .flatpickr-prev-month,
        /* 控制日历左右翻月箭头按钮尺寸 */
        .flatpickr-next-month {
            width: 1rem !important;
            height: 1rem !important;
            padding: 1rem !important;
            margin-left: 1rem !important;
            margin-right: 1rem !important;
            margin-top: 0.5rem !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 0 !important;
        }

        .flatpickr-prev-month > *,
        .flatpickr-next-month > * {
            display: none !important;
        }

        .flatpickr-prev-month::after,
        .flatpickr-next-month::after {
            font-family: Arial, "Microsoft YaHei", sans-serif !important;
            font-size: var(--calendar-nav-arrow-size);
            line-height: 1;
            color: #4b3521 !important;
        }

        .flatpickr-prev-month::after { content: "‹"; }
        .flatpickr-next-month::after { content: "›"; }

        .flatpickr-calendar .flatpickr-current-month .custom-select {
            pointer-events: auto;
            --custom-select-trigger-min-height: 1.7rem;
            --custom-select-trigger-height: auto;
            --custom-select-trigger-padding: 0.2rem 1.3rem 0 0.6rem;
            --custom-select-trigger-border-width: 0;
            --custom-select-trigger-border-color: transparent;
            --custom-select-trigger-border-radius: var(--custom-select-option-radius);
            --custom-select-trigger-bg-color: var(--notes-select-bg-color);
            --custom-select-trigger-font-size: var(--calendar-header-title-size);
            --custom-select-trigger-font-weight: 700;
            --custom-select-trigger-line-height: 1.1;
            --custom-select-trigger-transform: translateX(var(--calendar-header-title-offset-x));
            --custom-select-list-transform: translateX(var(--calendar-header-title-offset-x));
            --custom-select-list-min-width: 100%;
            --custom-select-list-max-height: var(--custom-select-slider-height);
            --custom-select-list-border-width: var(--notes-select-border-width);
            --custom-select-list-border-color: var(--notes-select-border-color);
            --custom-select-list-border-radius: var(--custom-select-option-radius);
            --custom-select-list-bg-color: var(--notes-select-bg-color);
            --custom-select-option-font-size: var(--calendar-base-text-size);
            --custom-select-option-font-weight: 400;
            --custom-select-text-color: #4b3521;
            --custom-select-arrow-right-gap: 0.4rem;
        }
        .flatpickr-calendar .flatpickr-current-month .custom-select-trigger {
            white-space: nowrap;
        }
        .flatpickr-calendar .flatpickr-current-month .custom-select-trigger:active {
            transform: var(--custom-select-trigger-transform, none) !important;
        }

        /* ===== C. 星期与日期网格（保持七列对齐） ===== */
        /* 控制日历内部主容器宽度 */
        .flatpickr-innerContainer {
            width: 100% !important;
            display: block !important;
        }

        /* 控制日历月份行高度 */
        .flatpickr-months {
            height: auto !important;
            min-height: 0 !important;
        }

        /* 控制星期标题行高度与对齐 */
        .flatpickr-weekdays {
            height: calc(var(--calendar-date-cell-height) * 0.75) !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            align-items: flex-start !important;
        }

        /* 控制日期区域主容器尺寸 */
        .flatpickr-days {
            width: 100% !important;
            height: auto !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            align-items: flex-start !important;
        }

        .flatpickr-weekdaycontainer,
        /* 控制日期网格容器基础尺寸与内边距 */
        .dayContainer {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            height: auto !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding-left: var(--calendar-grid-inline-padding) !important;
            padding-right: var(--calendar-grid-inline-padding) !important;
            box-sizing: border-box !important;
        }

        /* 控制日期网格内容在顶部对齐 */
        .dayContainer {
            align-content: flex-start !important;
        }

        /* 控制星期标题网格七列布局 */
        .flatpickr-weekdaycontainer {
            transform-origin: top center !important;
            display: grid !important;
            grid-template-columns: repeat(7, minmax(0, 1fr)) !important;
        }

        /* 控制星期标题单元格文字样式 */
        .flatpickr-weekday {
            width: 100% !important;
            min-width: 0 !important;
            box-sizing: border-box;
            font-size: var(--calendar-weekday-text-size) !important;
            line-height: var(--calendar-date-cell-height) !important;
        }

        /* 控制日期单元格尺寸与文字样式 */
        .flatpickr-day {
            flex: 0 0 calc(100% / 7) !important;
            width: calc(100% / 7) !important;
            max-width: calc(100% / 7) !important;
            min-width: 0 !important;
            height: var(--calendar-date-cell-height) !important;
            line-height: var(--calendar-date-cell-height) !important;
            box-sizing: border-box;
            border-radius: 4px;
            font-size: var(--calendar-date-text-size) !important;
            color: #4b3521 !important;
        }

        /* 保留占位，只隐藏前后月日期，保证星期列对齐 */
        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* ===== D. 日期交互态 ===== */
        .flatpickr-day:hover,
        .flatpickr-day.selected,
        .flatpickr-day.startRange,
        .flatpickr-day.endRange {
            background: #f5e8cf !important;
            border-color: transparent !important;
            border-radius: 9999px !important;
            box-shadow: none !important;
        }

        .flatpickr-day:focus {
            border-radius: 9999px !important;
        }

        .flatpickr-day.today:not(.selected) {
            border-color: transparent !important;
            box-shadow: none !important;
        }

        /* ===== E. 时间面板 ===== */
        /* 控制日历时间选择区容器样式 */
        .flatpickr-time {
            width: 100% !important;
            height: auto !important;
            min-height: 0 !important;
            max-height: none !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border-radius: 0 !important;
            background: #fff !important;
        }

        .flatpickr-time .numInputWrapper {
            height: 100% !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .flatpickr-time .numInputWrapper span.arrowUp,
        .flatpickr-time .numInputWrapper span.arrowDown {
            width: 2rem !important;

        .flatpickr-time input,
        .flatpickr-time .flatpickr-time-separator,
        .flatpickr-time .flatpickr-am-pm {
            font-size: var(--calendar-base-text-size) !important;
            font-weight: 700 !important;
        }

        .flatpickr-time input {
            height: 100% !important;
            padding: 0.8rem !important;
            text-align: center !important;
            line-height: 1 !important;
            caret-color: #4b3521 !important;

        .flatpickr-time .flatpickr-time-separator {

        .flatpickr-time input:focus,
        .flatpickr-time .flatpickr-am-pm:hover,
        .numInputWrapper:hover {

<body>
    <div class="page-root">

    <div class="page-header">

    <div id="notesLibraryPanel" class="theme-panel notes-library-panel is-hidden">
        <div class="notes-library-header">
            <span class="notes-library-title">笔记库</span>
            <div class="notes-library-header-actions">
                <button type="button" id="clearNotesLibraryButton" class="notes-library-clear-button action-theme-button" aria-label="清空所有笔记">清空所有笔记</button>

    <div id="notesPanelContainer" class="theme-panel notes-panel">
        <div class="notes-form">

    </div>
    <script>
        const palaces = ["大安", "留连", "速喜", "赤口", "小吉", "空亡"];
        const zhiOrder = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
        const palaceWuxingMap = ["木", "水", "火", "金", "木", "土"];
        const zhiWuxingMap = {
            "寅": "木", "卯": "木",
            "巳": "火", "午": "火",
            "丑": "土", "辰": "土", "未": "土", "戌": "土",
            "申": "金", "酉": "金",
            "亥": "水", "子": "水"
        };
        const wuxingShengMap = { "木": "火", "火": "土", "土": "金", "金": "水", "水": "木" };
        const wuxingKeMap = { "金": "木", "木": "土", "土": "水", "水": "火", "火": "金" };
        const wuXingBadgeColorMap = {
            "木星": "#2e7d32",
            "火星": "#c62828",
            "土星": "#7a5230",
            "金星": "#b8860b",
            "水星": "#1565c0",
            "天空": "#000000"
        };
        const liuShenBadgeColorMap = {
            "青龙": "#2e7d32",
            "朱雀": "#c62828",
            "勾陈": "#7a5230",
            "白虎": "#b8860b",
            "腾蛇": "#7a5230",
            "玄武": "#1565c0"
        };
        const wuxingColorMap = {
            "甲": "#2e7d32", "乙": "#2e7d32", "寅": "#2e7d32", "卯": "#2e7d32",
            "丙": "#c62828", "丁": "#c62828", "巳": "#c62828", "午": "#c62828",
            "戊": "#7a5230", "己": "#7a5230", "丑": "#7a5230", "辰": "#7a5230", "未": "#7a5230", "戌": "#7a5230",
            "庚": "#b8860b", "辛": "#b8860b", "申": "#b8860b", "酉": "#b8860b",
            "壬": "#1565c0", "癸": "#1565c0", "亥": "#1565c0", "子": "#1565c0"
        };
        const wuxingElementColorMap = {
            "木": "#2e7d32",
            "火": "#c62828",
            "土": "#7a5230",
            "金": "#b8860b",
            "水": "#1565c0"
        };
        function colorizeGanZhiText(text) {
            return Array.from(text).map((ch) => {
                const color = wuxingColorMap[ch];
                if (!color) return ch;
                return `<span style="color: ${color} !important;">${ch}</span>`;
            }).join('');
        }

        function updateClock() {
            const now = new Date();

            const solarStr = now.getFullYear() + '年' + 
                (now.getMonth() + 1) + '月' + 
                now.getDate() + '日 ' + 
                String(now.getHours()).padStart(2, '0') + ':' + 
                String(now.getMinutes()).padStart(2, '0') + ':' + 
                String(now.getSeconds()).padStart(2, '0');
            document.getElementById('solarClock').innerText = solarStr;

            const lunar = Lunar.fromDate(now);
            const lunarStr = `${lunar.getYearInGanZhi()}年 ${lunar.getMonthInGanZhi()}月 ${lunar.getDayInGanZhi()}日 ${lunar.getTimeInGanZhi()}时 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
            document.getElementById('lunarClock').innerHTML = colorizeGanZhiText(lunarStr);
        }

        function initGrid() {
            const grid = document.getElementById('palaceGrid');
            const displayOrder = [1, 2, 3, 0, 5, 4];
            grid.innerHTML = displayOrder.map((palaceIndex) => {
                const palaceName = palaces[palaceIndex];
                const palaceWuxing = palaceWuxingMap[palaceIndex];
                const underlineColor = wuxingElementColorMap[palaceWuxing] || "#4b3521";
                return `
                <div id="palace-${palaceIndex}" class="palace-card relative overflow-hidden">
                    <span class="palace-slot slot-wuxing palace-wuxing"></span>
                    <span class="palace-slot slot-liushen palace-liushen"></span>
                    <span class="palace-slot slot-zhi palace-zhi"></span>
                    <span class="palace-slot slot-liuqin palace-liuqin"></span>
                    <span class="palace-slot slot-daytime palace-daytime"></span>
                    <span class="palace-slot slot-body palace-body"></span>
                    <span class="palace-slot slot-palace-name" style="color: #000 !important; --palace-underline-color: ${underlineColor};">${palaceName}</span>
                </div>
            `;
            }).join('');
        }

        function setPalaceNameUnderlineVisible(visible) {
            document.querySelectorAll('.slot-palace-name').forEach((el) => {
                el.classList.toggle('show-underline', visible);
            });
        }

        function getShiChenCount(timeZhi) {
            const zhiIndex = zhiOrder.indexOf(timeZhi);
            return zhiIndex === -1 ? 1 : zhiIndex + 1;
        }

        function toDateTimeLocalValue(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}T${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function formatManualDateTimeValue(date) {
            return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        const dateTimeSegments = [
            { key: 'year', start: 0, end: 4, len: 4 },
            { key: 'month', start: 5, end: 7, len: 2 },
            { key: 'day', start: 8, end: 10, len: 2 },
            { key: 'hour', start: 11, end: 13, len: 2 },
            { key: 'minute', start: 14, end: 16, len: 2 }
        ];
        let activeSegmentIndex = 0;
        let segmentInputBuffer = '';
        let segmentPreviousValue = '';
        let chineseDatePicker = null;
        let isPointerFocusingManualInput = false;
        let detachCalendarAutoPosition = null;

        function getSegmentIndexByPosition(pos) {
            if (pos <= 4) return 0;
            if (pos <= 7) return 1;
            if (pos <= 10) return 2;
            if (pos <= 13) return 3;
            return 4;
        }

        function selectDateTimeSegment(input, segmentIndex) {
            const safeIndex = Math.max(0, Math.min(dateTimeSegments.length - 1, segmentIndex));
            const segment = dateTimeSegments[safeIndex];
            activeSegmentIndex = safeIndex;
            segmentInputBuffer = '';
            const parts = getSegmentValuesFromInput(input.value);
            segmentPreviousValue = parts[segment.key] || '';
            input.setSelectionRange(segment.start, segment.end);
        }

        function getSegmentValuesFromInput(value) {
            const strictMatch = String(value || '').match(/^(\d{4})\/(\d{2})\/(\d{2})\s(\d{2}):(\d{2})$/);
            if (strictMatch) {
                return {
                    year: strictMatch[1],
                    month: strictMatch[2],
                    day: strictMatch[3],
                    hour: strictMatch[4],
                    minute: strictMatch[5]
                };
            }
            const fallbackDate = parseDateTimeValue(value) || new Date();
            return {
                year: String(fallbackDate.getFullYear()).padStart(4, '0'),
                month: String(fallbackDate.getMonth() + 1).padStart(2, '0'),
                day: String(fallbackDate.getDate()).padStart(2, '0'),
                hour: String(fallbackDate.getHours()).padStart(2, '0'),
                minute: String(fallbackDate.getMinutes()).padStart(2, '0')
            };
        }

        function buildDateTimeTextFromParts(parts) {
            return `${parts.year}/${parts.month}/${parts.day} ${parts.hour}:${parts.minute}`;
        }

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function isSegmentValueValid(segmentKey, candidate, parts) {
            const numeric = Number(candidate);
            if (!Number.isFinite(numeric)) return false;
            if (segmentKey === 'year') return numeric >= 1 && numeric <= new Date().getFullYear();
            if (segmentKey === 'month') return numeric >= 1 && numeric <= 12;
            if (segmentKey === 'hour') return numeric >= 0 && numeric <= 23;
            if (segmentKey === 'minute') return numeric >= 0 && numeric <= 59;
            if (segmentKey === 'day') {
                const year = Number(parts.year);
                const month = Number(parts.month);
                if (month < 1 || month > 12 || year < 1 || year > new Date().getFullYear()) return false;
                return numeric >= 1 && numeric <= getDaysInMonth(year, month);
            }
            return false;
        }

        function parseStrictManualDateTimeValue(value) {
            if (!value) return null;
            const raw = String(value).trim();
            const slashMatch = raw.match(/^(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})$/);
            if (!slashMatch) return null;
            const [, yStr, mStr, dStr, hStr, minStr] = slashMatch;
            const year = Number(yStr);
            const month = Number(mStr);
            const day = Number(dStr);
            const hour = Number(hStr);
            const minute = Number(minStr);
            if (year > new Date().getFullYear()) return null;
            if (month < 1 || month > 12 || day < 1 || day > 31 || hour > 23 || minute > 59) return null;
            const date = new Date(year, month - 1, day, hour, minute, 0, 0);
            if (
                date.getFullYear() !== year ||
                date.getMonth() !== month - 1 ||
                date.getDate() !== day ||
                date.getHours() !== hour ||
                date.getMinutes() !== minute
            ) {
                return null;
            }
            return date;
        }

        function parseDateTimeValue(value) {
            if (!value) return null;
            const strictManualDate = parseStrictManualDateTimeValue(value);
            if (strictManualDate) return strictManualDate;
            const raw = String(value).trim();
            const normalized = raw.includes('T') ? raw : raw.replace(' ', 'T');
            const date = new Date(normalized);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function validateManualDateTimeInput(rawValue, { report = false } = {}) {
            const manualInput = document.getElementById('dateTimeManualInput');
            const date = parseStrictManualDateTimeValue(rawValue);
            if (date) {
                manualInput.setCustomValidity('');
                return date;
            }
            manualInput.setCustomValidity('请输入有效时间，格式为 yyyy/mm/dd HH:mm');
            if (report) manualInput.reportValidity();
            return null;
        }

        function updateSelectedDateLunarInfo(date) {
            const lunarInfoEl = document.getElementById('selectedDateLunarInfo');
            if (!lunarInfoEl) return;
            if (!date) {
                lunarInfoEl.innerText = '';
                return;
            }
            const lunar = Lunar.fromDate(date);
            const lunarText = `${lunar.getYearInGanZhi()}年 ${lunar.getMonthInGanZhi()}月 ${lunar.getDayInGanZhi()}日 ${lunar.getTimeInGanZhi()}时 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
            lunarInfoEl.innerHTML = colorizeGanZhiText(lunarText);
        }

        function positionCalendarCenteredBelowDateTimeRow(instance) {
            if (!instance || !instance.calendarContainer) return;
            const anchorRow = document.querySelector('.datetime-row');
            if (!anchorRow) return;
            const calendarEl = instance.calendarContainer;
            const rowRect = anchorRow.getBoundingClientRect();
            const calendarRect = calendarEl.getBoundingClientRect();
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
            const sidePadding = Math.max(8, Math.floor(viewportWidth * 0.03));
            const centeredLeft = (viewportWidth - calendarRect.width) / 2;
            const maxLeft = Math.max(sidePadding, viewportWidth - calendarRect.width - sidePadding);
            const horizontalLeft = Math.min(Math.max(sidePadding, centeredLeft), maxLeft);
            const verticalTop = rowRect.bottom + (window.scrollY || window.pageYOffset || 0) + 8;

            calendarEl.style.position = 'absolute';
            calendarEl.style.left = `${horizontalLeft + (window.scrollX || window.pageXOffset || 0)}px`;
            calendarEl.style.top = `${verticalTop}px`;
            calendarEl.style.right = 'auto';
        }

        function attachCalendarAutoPosition(instance) {
            if (!instance || detachCalendarAutoPosition) return;
            const syncPosition = () => {
                if (!instance.isOpen) return;
                positionCalendarCenteredBelowDateTimeRow(instance);
            };
            const onResize = () => {
                if (typeof instance.redraw === 'function') {
                    instance.redraw();
                }
                syncPosition();
            };
            const onScroll = () => syncPosition();
            window.addEventListener('resize', onResize);
            window.addEventListener('scroll', onScroll, true);
            detachCalendarAutoPosition = () => {
                window.removeEventListener('resize', onResize);
                window.removeEventListener('scroll', onScroll, true);
                detachCalendarAutoPosition = null;
            };
        }

        function detachCalendarPositionListeners() {
            if (detachCalendarAutoPosition) {
                detachCalendarAutoPosition();
            }
        }

        function setDateTimeValue(value) {
            const dateTimeInput = document.getElementById('dateTime');
            const manualInput = document.getElementById('dateTimeManualInput');
            const date = parseDateTimeValue(value);
            const normalizedValue = date ? toDateTimeLocalValue(date) : '';
            const previousValue = dateTimeInput.value;
            if (previousValue && previousValue !== normalizedValue) {
                clearCurrentCalculationResult();
            }
            dateTimeInput.value = normalizedValue;
            if (manualInput) manualInput.value = date ? formatManualDateTimeValue(date) : '';
            if (chineseDatePicker && date) {
                chineseDatePicker.setDate(date, false);
            }
            updateSelectedDateLunarInfo(date);
        }

        function clearCurrentCalculationResult() {
            clearPalaceLayoutTexts();
            setPalaceNameUnderlineVisible(false);
            refreshAllNotePalacePreviews();
        }

        function ensureDefaultCurrentDateTime() {
            const current = document.getElementById('dateTime').value;
            if (current && parseDateTimeValue(current)) return;
            setDateTimeValue(toDateTimeLocalValue(new Date()));
        }

        function applyManualInputDateTime(rawValue) {
            const date = validateManualDateTimeInput(rawValue);
            if (!date) {
                const hiddenValue = document.getElementById('dateTime').value;
                const fallbackDate = parseDateTimeValue(hiddenValue);
                if (fallbackDate) {
                    document.getElementById('dateTimeManualInput').value = formatManualDateTimeValue(fallbackDate);
                }
                return;
            }
            setDateTimeValue(toDateTimeLocalValue(date));
        }

        function setPalaceText(index, selector, text) {
            const el = document.getElementById(`palace-${index}`);
            if (!el) return;
            const slot = el.querySelector(selector);
            if (!slot) return;
            slot.innerText = text || '';
        }

        function setCircledPalaceText(index, selector, texts) {
            const el = document.getElementById(`palace-${index}`);
            if (!el) return;
            const slot = el.querySelector(selector);
            if (!slot) return;
            if (!texts || !texts.length) {
                slot.innerHTML = '';
                return;
            }
            slot.innerHTML = texts.map((text) => `<span class="circled-char">${text}</span>`).join('');
        }

        function setZhiLabel(index, zhi) {

            if (wuxingShengMap[targetWuxing] === selfWuxing) return '父母';

        function calculateLiuQinAssignments(arrangedPalaceZhi, bodyIndex) {
            const bodyItem = arrangedPalaceZhi.find(item => item.palaceIndex === bodyIndex);
            if (!bodyItem) return [];
            const selfWuxing = zhiWuxingMap[bodyItem.zhi];
            const bodyPalaceWuxing = palaceWuxingMap[bodyIndex];
            const liuQinList = arrangedPalaceZhi.map((item) => {
                if (item.palaceIndex === bodyIndex) {
                    const selfLiuQin = getLiuQinByWuxing(selfWuxing, bodyPalaceWuxing);
                    return { ...item, liuQin: selfLiuQin || '身宫' };
                }
                const targetWuxing = zhiWuxingMap[item.zhi];
                const liuQin = getLiuQinByWuxing(selfWuxing, targetWuxing);
                return { ...item, liuQin };
            });

            const hasBrother = liuQinList.some(item => item.palaceIndex !== bodyIndex && item.liuQin === '兄弟');
            if (!hasBrother) {
                for (let step = 1; step <= 5; step++) {
                    const palaceIndex = (bodyIndex + step) % 6;
                    const target = liuQinList.find(item => item.palaceIndex === palaceIndex);
                    if (!target) continue;
                    const targetWuxing = zhiWuxingMap[target.zhi];
                    if (targetWuxing === '土') {
                        target.liuQin = '兄弟';
                        break;
                    }
                }
            }
            return liuQinList;
        }

        function calculateLiuShenAssignments(bodyZhi) {
            const liuShenOrder = ['青龙', '朱雀', '勾陈', '白虎', '玄武', '腾蛇'];
            const bodyZhiIndex = zhiOrder.indexOf(bodyZhi);
            if (bodyZhiIndex === -1) return [];
            const qingLongStartPalaceIndex = bodyZhiIndex % 6;
            const assignments = [];
            for (let step = 0; step < 6; step++) {
                assignments.push({
                    palaceIndex: (qingLongStartPalaceIndex + step) % 6,
                    liuShen: liuShenOrder[step]
                });
            }
            return assignments;
        }

        function calculateWuXingAssignments(dayPalaceIndex) {
            const wuXingOrder = ['木星', '火星', '土星', '金星', '水星', '天空'];
            const assignments = [];
            for (let step = 0; step < 6; step++) {
                assignments.push({
                    palaceIndex: (dayPalaceIndex + step) % 6,
                    wuXing: wuXingOrder[step]
                });
            }
            return assignments;
        }

        function arrangePalaceZhiByTimePalace(timePalaceIndex, timeZhi) {
            const startZhiIndex = zhiOrder.indexOf(timeZhi);
            if (startZhiIndex === -1) return [];
            const arranged = [];
            for (let step = 0; step < 6; step++) {
                const palaceIndex = (timePalaceIndex + step) % 6;
                const zhiIndex = (startZhiIndex + step * 2) % zhiOrder.length;
                const zhi = zhiOrder[zhiIndex];
                arranged.push({ palaceIndex, zhi });
            }
            return arranged;
        }

        const createCustomSelect = ({
            rootClassName = '',
            options = [],
            onSelect = () => {},
            closeScopeElement = null,
            bindDocumentClose = false,
            emptyLabel = '',
            centerSelectedOnOpen = false
        }) => {
            const root = document.createElement('div');
            root.className = `custom-select ${rootClassName}`.trim();
            const trigger = document.createElement('button');
            trigger.type = 'button';
            trigger.className = 'custom-select-trigger';
            trigger.setAttribute('aria-haspopup', 'listbox');
            trigger.setAttribute('aria-expanded', 'false');
            const triggerLabel = document.createElement('span');
            trigger.appendChild(triggerLabel);
            const list = document.createElement('div');
            list.className = 'custom-select-list is-hidden';
            list.setAttribute('role', 'listbox');
            const optionButtons = new Map();
            const closeList = () => {
                root.classList.remove('is-open');
                list.classList.add('is-hidden');
                trigger.setAttribute('aria-expanded', 'false');
            };
            const openList = () => {
                const scope = closeScopeElement || root.parentElement || document;
                closeOpenCustomSelects(scope, root);
                root.classList.add('is-open');
                list.classList.remove('is-hidden');
                trigger.setAttribute('aria-expanded', 'true');
                if (centerSelectedOnOpen) {
                    window.requestAnimationFrame(() => {
                        const selectedOption = list.querySelector('.custom-select-option.is-selected');
                        if (!selectedOption) return;
                        const targetTop = selectedOption.offsetTop - (list.clientHeight - selectedOption.offsetHeight) / 2;
                        list.scrollTop = Math.max(0, targetTop);
                    });
                }
            };
            const setValue = (value) => {
                const fallback = options[0];
                const matched = options.find((item) => item.value === value) || fallback;
                if (!matched) return;
                triggerLabel.textContent = matched.label.trim() ? matched.label : emptyLabel;
                optionButtons.forEach((button, buttonValue) => {
                    const selected = buttonValue === matched.value;
                    button.classList.toggle('is-selected', selected);
                    button.setAttribute('aria-selected', selected ? 'true' : 'false');
                });
            };
            options.forEach((item) => {
                const optionButton = document.createElement('button');
                optionButton.type = 'button';
                optionButton.className = 'custom-select-option';
                optionButton.dataset.value = item.value;
                optionButton.setAttribute('role', 'option');
                optionButton.textContent = item.label.trim() ? item.label : emptyLabel;
                optionButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    onSelect(item.value);
                    setValue(item.value);
                    closeList();
                });
                list.appendChild(optionButton);
                optionButtons.set(item.value, optionButton);
            });
            trigger.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                if (root.classList.contains('is-open')) {
                    closeList();
                } else {
                    openList();
                }
            });
            if (bindDocumentClose) {
                document.addEventListener('mousedown', (event) => {
                    if (root.contains(event.target)) return;
                    closeList();
                });
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') closeList();
                });
            }
            root.appendChild(trigger);
            root.appendChild(list);
            return { root, setValue, closeList };
        };
